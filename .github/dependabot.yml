version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Africa/Nairobi
    open-pull-requests-limit: 10
    # Routine updates may be grouped. Version-sensitive dependencies stay
    # individual so their contract evidence is reviewed with the version bump.
    groups:
      routine-production-maintenance:
        dependency-type: production
        update-types:
          - minor
          - patch
        patterns:
          - '*'
        exclude-patterns:
          - '@prisma/*'
          - pg
      routine-development-maintenance:
        dependency-type: development
        update-types:
          - minor
          - patch
        patterns:
          - '*'
        exclude-patterns:
          - '@testcontainers/*'
          - '@types/node'
          - prisma
          - testcontainers
          - typescript
    ignore:
      # The type surface must track the supported Node 24 runtime.
      - dependency-name: '@types/node'
        versions:
          - '>=25'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:15'
      timezone: Africa/Nairobi
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: Africa/Nairobi
    open-pull-requests-limit: 5
