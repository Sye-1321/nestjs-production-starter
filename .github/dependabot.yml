version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Africa/Nairobi
    open-pull-requests-limit: 10
    # Related version updates are grouped before routine catch-all groups so
    # first-match behavior keeps each compatibility surface together.
    groups:
      nestjs-framework:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns:
          - '@nestjs/common'
          - '@nestjs/core'
          - '@nestjs/platform-express'
      prisma-stack:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns:
          - '@prisma/adapter-pg'
          - '@prisma/client'
          - prisma
      testcontainers:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns:
          - '@testcontainers/postgresql'
          - testcontainers
      routine-production-maintenance:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
        patterns:
          - '*'
        exclude-patterns:
          - '@prisma/*'
          - pg
      routine-development-maintenance:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
        patterns:
          - '*'
        exclude-patterns:
          - '@testcontainers/*'
          - '@types/node'
          - prisma
          - testcontainers
          - typescript
    ignore:
      # The type surface must track the supported Node 24 runtime.
      - dependency-name: '@types/node'
        versions:
          - '>=25'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:15'
      timezone: Africa/Nairobi
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: Africa/Nairobi
    open-pull-requests-limit: 5
    groups:
      codeql-actions:
        applies-to: version-updates
        patterns:
          - github/codeql-action/init
          - github/codeql-action/analyze
